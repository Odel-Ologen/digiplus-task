<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Rodel Ologen — Frontend Developer</title>
    <meta
      name="description"
      content="Vue 3 frontend developer with two years of professional experience building production web apps: admin CMS tooling, customer-facing sites and mobile web in native shells."
    />

    <!-- Keep the site out of search results: it names a current employer while
         a job search is in progress. Recruiters get the link directly. Remove
         this line once you want it publicly discoverable. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rodel Ologen — Frontend Developer" />
    <meta
      property="og:description"
      content="Vue 3 frontend developer with two years of professional experience building production web apps."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Monogram favicon, inlined so there is no extra request -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d0f14'/><text x='50' y='67' text-anchor='middle' font-family='sans-serif' font-size='44' font-weight='600' fill='%232dd4bf'>RO</text></svg>"
    />

    <!-- Inter is referenced by --font-sans, so it has to actually load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Runs before first paint so a saved theme applies with no flash of the
         wrong one. Deliberately not in the Vue app: that mounts too late.
         No stored choice means no attribute, leaving prefers-color-scheme
         in charge. -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('theme')
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.dataset.theme = saved
          }
        } catch (e) {
          /* localStorage can throw in private browsing */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
